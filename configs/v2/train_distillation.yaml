# DMD distillation config for Wan2.2 high-noise model
# Maps directly to DMDTrainConfig fields

generator_name: Wan2.2-T2V-A14B/high_noise_model
real_score_name: Wan2.2-T2V-A14B/high_noise_model
fake_score_name: Wan2.2-T2V-A14B/high_noise_model

generator_is_causal: false
timestep_shift: 5.0
target: high_noise
boundary_step: 500
gradient_checkpointing: true
num_train_timestep: 1000

denoising_step_list:
  - 1000
  - 750

dfake_gen_update_ratio: 5
guidance_scale: 4.0

lr: 2.0e-06
beta1: 0.0
beta2: 0.999
weight_decay: 0.01
max_grad_norm_generator: 10.0

lr_critic: 4.0e-07
beta1_critic: 0.0
beta2_critic: 0.999
max_grad_norm_critic: 10.0

data_type: text_folder
data_path: prompts/good_prompts/
data_max_count: 200000
batch_size: 1
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

ema_weight: 0.99
ema_start_step: 200

image_or_video_shape:
  - 1
  - 21
  - 16
  - 60
  - 104

logdir: logs/dmd_distillation
log_iters: 200
gc_interval: 100
no_save: false
disable_wandb: true
config_name: wan22_high_dmd

seed: 0
mixed_precision: bf16
